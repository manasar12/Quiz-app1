<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .quiz-container {
      background: #fff;
      width: 400px;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    .option {
      display: block;
      background: #f1f1f1;
      margin: 8px 0;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .option:hover {
      background: #dfe6e9;
    }
    /* NEW: Darkened state for selected option */
    .option.selected {
      background: #3498db;
      color: white;
    }
    .btn {
      background: #0984e3;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      margin-top: 15px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn:hover {
      background: #74b9ff;
    }
    .result {
      font-size: 18px;
      font-weight: bold;
      margin-top: 20px;
    }
    .timer {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #d63031;
    }
    .progress-container {
      background: #dfe6e9;
      border-radius: 5px;
      height: 15px;
      margin: 15px 0;
      overflow: hidden;
    }
    .progress-bar {
      background: #0984e3;
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="quiz-container" id="quiz-container">
    <h2 id="question">Question text</h2>
    <div class="timer" id="timer">Time Left: 15s</div>
    
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    
    <div id="options"></div>
    <button class="btn" onclick="nextQuestion()">Next</button>
    <div class="result" id="result"></div>
  </div>

  <script>
    const quizData = [
      {
        question: "Which language is used for web apps?",
        options: ["Python", "JavaScript", "C++", "Java"],
        answer: "JavaScript"
      },
      {
        question: "What does CSS stand for?",
        options: ["Cascading Style Sheets", "Colorful Style Sheets", "Computer Styled Sections", "Creative Style System"],
        answer: "Cascading Style Sheets"
      },
      {
        question: "Which HTML tag is used to create a hyperlink?",
        options: ["<a>", "<link>", "<href>", "<p>"],
        answer: "<a>"
      },
      {
        question: "Inside which HTML element do we put JavaScript?",
        options: ["<js>", "<javascript>", "<script>", "<code>"],
        answer: "<script>"
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let timeLeft = 15;
    let timer;
    let selectedOption = null; // NEW: Track selected option

    function loadQuestion() {
      const questionEl = document.getElementById("question");
      const optionsEl = document.getElementById("options");
      const timerEl = document.getElementById("timer");
      const progressBar = document.getElementById("progress-bar");

      // Reset selected option for new question
      selectedOption = null; // NEW: Reset selection

      const q = quizData[currentQuestion];
      questionEl.innerText = `Q${currentQuestion+1}: ${q.question}`;
      optionsEl.innerHTML = "";
      q.options.forEach(opt => {
        const btn = document.createElement("div");
        btn.classList.add("option");
        btn.innerText = opt;
        btn.onclick = () => selectOption(btn, opt); // MODIFIED: Use selectOption function
        optionsEl.appendChild(btn);
      });

      // Update progress bar
      let progressPercent = ((currentQuestion) / quizData.length) * 100;
      progressBar.style.width = progressPercent + "%";

      // Reset and start timer
      clearInterval(timer);
      timeLeft = 15;
      timerEl.innerText = `Time Left: ${timeLeft}s`;
      timer = setInterval(() => {
        timeLeft--;
        timerEl.innerText = `Time Left: ${timeLeft}s`;
        if (timeLeft <= 0) {
          clearInterval(timer);
          nextQuestion();
        }
      }, 1000);
    }

    // NEW: Function to handle option selection
    function selectOption(optionElement, selected) {
      // Remove selection from all options
      document.querySelectorAll(".option").forEach(opt => {
        opt.classList.remove("selected");
      });
      
      // Add selection to clicked option
      optionElement.classList.add("selected");
      selectedOption = selected;
    }

    function checkAnswer() {
      if (selectedOption === quizData[currentQuestion].answer) {
        score++;
      }
      document.querySelectorAll(".option").forEach(opt => {
        opt.onclick = null;
      });
    }

    function nextQuestion() {
      // Check answer before moving to next question
      if (selectedOption !== null) {
        checkAnswer();
      }
      
      clearInterval(timer);
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        document.getElementById("quiz-container").innerHTML =
          `<h2>Quiz Completed</h2>
           <p class="result">Your Score: ${score} / ${quizData.length}</p>`;
      }
    }

    loadQuestion();
  </script>
</body>
</html>
